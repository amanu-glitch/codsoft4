<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glow & Shake Brain Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Particle Background Layer (Brain Neural Effect) -->
  <div id="particles-js"></div>

  <!-- Content Layer (Calculator held by Hands) -->
  <div class="main-container">
    <div class="hands-container">

      
      <div class="calculator-wrapper">
        <div class="calculator" id="calculator">
          <div class="display">
            <input type="text" id="result" readonly placeholder="0">
          </div>
          <div class="buttons">
            <button class="btn action" onclick="clearDisplay()">AC</button>
            <button class="btn action" onclick="deleteLast()">DEL</button>
            <button class="btn operator" onclick="appendValue('/')">&divide;</button>
            <button class="btn operator" onclick="appendValue('*')">&times;</button>

            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn operator" onclick="appendValue('-')">-</button>

            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn operator" onclick="appendValue('+')">+</button>

            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn equal" onclick="calculate()">=</button>

            <button class="btn zero" onclick="appendValue('0')">0</button>
            <button class="btn" onclick="appendValue('.')">.</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- External Library for Brain Particles & Custom Script -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
